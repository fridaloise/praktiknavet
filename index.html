
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praktiknavet 4.1 – APL utan krångel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink-bg:#F9E4E9;
  --pink-card:#F1C9D3;
  --pink-header:#DDA6B6;
  --pink-deep:#A45368;
  --yellow:#F5DA83;
  --yellow-light:#FBE9AB;
  --sage:#E1E5CF;
  --ink:#533B46;
  --muted:#725A65;
  --line:#DDB7C2;
  --field:#F7DDE4;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--pink-bg);
  color:var(--ink);
  font-family:"Quicksand",sans-serif;
  font-size:15px;
  font-weight:500;
  line-height:1.55;
}

button,input,select,textarea {
  font:inherit;
}

button { cursor:pointer; }

header {
  background:var(--pink-header);
  border-bottom:1px solid var(--line);
  padding:22px 20px;
}

.header-inner {
  max-width:1120px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}

.brand {
  font-size:34px;
  font-weight:700;
  letter-spacing:-1.5px;
  color:#593847;
  line-height:1.2;
}

.subtitle {
  font-size:11px;
  letter-spacing:2px;
  font-weight:700;
  color:#684653;
  margin-top:5px;
}

main {
  max-width:1120px;
  margin:28px auto;
  padding:0 18px 40px;
}

h1,h2,h3 {
  line-height:1.3;
  letter-spacing:-.5px;
}

h1 { font-size:29px; margin:0 0 8px; }
h2 { font-size:25px; margin:0 0 16px; }
h3 { font-size:19px; margin:0 0 12px; }

p { margin:8px 0 14px; }

.muted { color:var(--muted); font-size:13px; }

.hero {
  padding:20px 4px 24px;
}

.hero p { color:var(--muted); }

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin:12px 0 25px;
}

.tile {
  border:1px solid var(--line);
  border-radius:20px;
  padding:25px;
  text-align:left;
  min-height:140px;
  color:var(--ink);
  transition:transform .15s,box-shadow .15s;
}

.tile:hover {
  transform:translateY(-2px);
  box-shadow:0 7px 18px #8e4b6317;
}

.tile strong {
  display:block;
  font-size:21px;
  font-weight:700;
}

.tile small {
  display:block;
  margin-top:10px;
  color:#725A65;
  font-size:13px;
}

.tile-pink { background:var(--pink-card); }
.tile-yellow { background:var(--yellow); }
.tile-sage { background:var(--sage); }

.card {
  background:var(--pink-card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:23px;
  margin-bottom:17px;
}

.card.yellow {
  background:var(--yellow-light);
  border-color:#E8CF83;
}

.card.sage {
  background:var(--sage);
  border-color:#C6CFB6;
}

.notice {
  background:var(--yellow-light);
  border:1px solid #E8CF83;
  border-radius:15px;
  padding:16px;
  margin:16px 0;
}

.notice.sage {
  background:var(--sage);
  border-color:#C6CFB6;
}

.btn {
  background:var(--pink-deep);
  color:#FFF7F9;
  border:0;
  border-radius:12px;
  padding:11px 17px;
  font-weight:700;
  margin:5px 6px 5px 0;
}

.btn:hover { filter:brightness(.94); }

.btn.alt {
  background:var(--yellow);
  color:#614B36;
  border:1px solid #E2C36B;
}

.btn.back {
  background:var(--pink-card);
  color:var(--ink);
  border:1px solid var(--line);
  margin-bottom:22px;
}

label {
  display:block;
  font-weight:700;
  font-size:13px;
  margin:13px 0 6px;
}

input,select,textarea {
  display:block;
  width:100%;
  background:var(--field);
  color:var(--ink);
  border:1px solid #D6AEBB;
  border-radius:11px;
  padding:11px 12px;
  outline-color:var(--pink-deep);
}

textarea {
  min-height:90px;
  resize:vertical;
}

input[type="checkbox"] {
  width:18px;
  height:18px;
  accent-color:var(--pink-deep);
  flex-shrink:0;
}

.check {
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-weight:600;
  margin:13px 0;
}

.check input { margin:2px 0 0; }

.fields {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}

.row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}

.item {
  padding:15px 0;
  border-bottom:1px solid #D9AEBB;
}

.item:last-child { border-bottom:0; }

.big {
  font-size:30px;
  font-weight:700;
  color:#8D465B;
}

.section-label {
  margin:28px 0 12px;
  color:#8D465B;
  font-weight:700;
}

.scroll { overflow:auto; }

table {
  width:100%;
  border-collapse:collapse;
}

td,th {
  padding:11px 9px;
  border-bottom:1px solid #D9AEBB;
  text-align:left;
}

.status {
  display:inline-block;
  background:var(--yellow);
  color:#604C35;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.status.good {
  background:var(--sage);
  color:#526044;
}

footer {
  max-width:1120px;
  margin:20px auto 35px;
  padding:0 18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:600px) {
  header { padding:18px 15px; }
  .brand { font-size:29px; }
  main { margin:15px auto; padding:0 12px 30px; }
  .grid { gap:11px; }
  .tile { padding:17px; min-height:120px; }
  .tile strong { font-size:17px; }
  .tile small { font-size:12px; }
  .card { padding:17px; }
  h1 { font-size:25px; }
}

@media print {
  header,footer,button,.no-print { display:none!important; }
  body { background:var(--pink-bg); }
  main { max-width:none; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">Praktiknavet</div>
      <div class="subtitle">APL UTAN KRÅNGEL</div>
    </div>

    <div>
      <label for="role">Visa som</label>
      <select id="role" onchange="changeRole(this.value)">
        <option value="teacher">Lärare</option>
        <option value="student">Elev</option>
        <option value="supervisor">Handledare</option>
      </select>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  Praktiknavet 4.1 · Testversion med fiktiva uppgifter
</footer>

<script>
"use strict";

/*
  Praktiknavet 4.1
  Testversion med lokal lagring.
  Ingen verklig autentisering eller behörighetskontroll.
*/

const KEY="praktiknavet-test-4-simple";

const groups={
  NVF25A:[3,4,5],
  NVF25B:[6,7,9],
  NVF24A:[10,11,12,14,15,16],
  NVF24B:[17,18,19,20,21]
};

const courses={
  NVF25:[
    ["VVS och fastighet nivå 2",40],
    ["VVS-teknik nivå 1",20],
    ["VVS-teknik nivå 2",30],
    ["VVS-installation nivå 1",20],
    ["Försäljning och kundservice nivå 1",40]
  ],
  NVF24:[
    ["Entreprenadteknik",20],
    ["Injusteringsteknik",30],
    ["VVS gassvetsning rör",30],
    ["VVS-teknik",130],
    ["Värmeteknik 2",40]
  ]
};

const moments={
  "VVS och fastighet nivå 2":[
    "Beskriva hur VVS-system fungerar",
    "Välja material och verktyg",
    "Arbeta säkert och ergonomiskt",
    "Samarbeta med andra yrkesgrupper"
  ],
  "VVS-teknik nivå 1":[
    "Läsa en enkel VVS-ritning",
    "Känna igen rör och kopplingar",
    "Delta vid enklare fogning",
    "Kontrollera utfört arbete"
  ],
  "VVS-teknik nivå 2":[
    "Läsa ritningar och driftkort",
    "Välja material och verktyg",
    "Montera rör och kopplingar",
    "Delta vid fogning",
    "Felsöka och reparera",
    "Göra funktionskontroll",
    "Delta vid injustering",
    "Dokumentera arbetet"
  ],
  "VVS-installation nivå 1":[
    "Planera en installation",
    "Montera rör och komponenter",
    "Kontrollera täthet och funktion",
    "Dokumentera arbetet"
  ],
  "Försäljning och kundservice nivå 1":[
    "Bemöta kunder",
    "Lyssna på kundens behov",
    "Förklara en arbetsuppgift",
    "Samarbeta med kollegor"
  ],
  "Entreprenadteknik":[
    "Förstå byggprocessens olika steg",
    "Läsa bygghandlingar",
    "Planera arbetsuppgifter",
    "Förstå entreprenadformer"
  ],
  "Injusteringsteknik":[
    "Mäta flöden och temperaturer",
    "Använda mätinstrument",
    "Delta vid injustering",
    "Dokumentera mätvärden"
  ],
  "VVS gassvetsning rör":[
    "Känna till utrustning och risker",
    "Förbereda arbetsstycken",
    "Observera eller delta under handledning",
    "Kontrollera arbetsmiljön"
  ],
  "VVS-teknik":[
    "Läsa VVS-ritningar",
    "Installera rörsystem",
    "Felsöka",
    "Kontrollera och dokumentera"
  ],
  "Värmeteknik 2":[
    "Förstå värmesystem",
    "Kontrollera temperatur och tryck",
    "Felsöka värmesystem",
    "Delta i drift och underhåll"
  ]
};

const hazards=[
  "Maskiner och verktyg",
  "Heta arbeten och svetsning",
  "Tunga lyft och ergonomi",
  "Stegar och arbete på höjd",
  "Elrisker",
  "Kemikalier",
  "Buller och vibrationer",
  "Damm och ventilation",
  "Ensamarbete",
  "Stress och kränkningar",
  "Bristande introduktion",
  "Annat"
];

function defaults(){
  const students=[];

  Object.entries({
    NVF25A:10,
    NVF25B:10,
    NVF24A:9,
    NVF24B:8
  }).forEach(([group,count])=>{
    for(let i=1;i<=count;i++){
      students.push({
        id:group+"-"+i,
        name:"Elev "+String(i).padStart(2,"0")+" – "+group,
        group,
        companyId:"",
        supervisorId:""
      });
    }
  });

  return {
    students,
    companies:[
      {
        id:"c1",
        name:"Exempel VVS AB",
        phone:"070-000 00 01",
        capacity:2,
        status:"Tackat ja"
      },
      {
        id:"c2",
        name:"Rör & Värme Demo",
        phone:"070-000 00 02",
        capacity:2,
        status:"Tackat ja"
      }
    ],
    supervisors:[
      {
        id:"h1",
        companyId:"c1",
        name:"Anna Andersson",
        phone:"070-000 00 01",
        email:"anna@example.invalid",
        job:"VVS-montör"
      }
    ],
    time:{},
    progress:{},
    reports:[],
    risks:[],
    decisions:[],
    visits:[]
  };
}

let data;

try {
  data={
    ...defaults(),
    ...JSON.parse(localStorage.getItem(KEY)||"{}")
  };
} catch {
  data=defaults();
}

let role="teacher";
let page="home";
let selected=data.students[0].id;
let selectedSupervisor=data.supervisors[0].id;
let week=3;

const el=id=>document.getElementById(id);

function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function id(){
  return Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);
}

function pupil(sid){
  return data.students.find(s=>s.id===sid);
}

function company(cid){
  return data.companies.find(c=>c.id===cid);
}

function supervisor(hid){
  return data.supervisors.find(h=>h.id===hid);
}

function courseList(s){
  return courses[s.group.slice(0,5)]||[];
}

function options(items,value,label){
  return items.map(x=>`
    <option value="${safe(x.id)}"
      ${x.id===value?"selected":""}>
      ${safe(label(x))}
    </option>
  `).join("");
}

function changeRole(value){
  role=value;
  page="home";
  render();
}

function go(value){
  page=value;
  render();
  window.scrollTo(0,0);
}

function back(){
  return `
    <button class="btn back no-print"
      onclick="go('home')">Tillbaka</button>
  `;
}

function tile(name,description,target,color){
  return `
    <button class="tile ${color}"
      onclick="go('${target}')">
      <strong>${name}</strong>
      <small>${description}</small>
    </button>
  `;
}

function render(){
  el("app").innerHTML=
    role==="teacher" ? teacherView() :
    role==="student" ? studentView() :
    supervisorView();
}

function teacherView(){
  if(page==="home"){
    return `
      <div class="hero">
        <h1>Hej och välkommen!</h1>
        <p>Vad vill du göra idag?</p>
      </div>

      <div class="grid">
        ${tile("Företag","Kontakter och handledare",
          "companies","tile-pink")}
        ${tile("Elever","Placeringar och uppföljning",
          "students","tile-yellow")}
        ${tile("Veckorapporter","Elevernas arbete",
          "reports","tile-yellow")}
        ${tile("Att göra","Det som behöver följas upp",
          "todo","tile-pink")}
      </div>

      <div class="section-label">Mer i Praktiknavet</div>

      <div class="grid">
        ${tile("Kurser och APL-timmar","Planerade kursdelar",
          "courses","tile-sage")}
        ${tile("APL-besök","Besök och anteckningar",
          "visits","tile-pink")}
        ${tile("Riskbedömning","Risker och åtgärder",
          "risks","tile-yellow")}
        ${tile("APL-beslut","Samråd och rektorsbeslut",
          "decisions","tile-sage")}
      </div>

      <div class="notice sage">
        <strong>Allt kring APL på ett ställe.</strong>
        <p>Enkelt för elever, handledare och lärare.</p>
        <div class="muted">
          Öppen testversion med fiktiva uppgifter.
          Ingen riktig inloggning eller säker databas ännu.
        </div>
      </div>
    `;
  }

  if(page==="companies")return companiesView();
  if(page==="students")return studentsView();
  if(page==="detail")return detailView();
  if(page==="reports")return reportsView();
  if(page==="todo")return todoView();
  if(page==="courses")return coursesView();
  if(page==="visits")return visitsView();
  if(page==="risks")return risksView();
  if(page==="decisions")return decisionsView();

  return "";
}

function companiesView(){
  return `
    ${back()}
    <h2>Företag och handledare</h2>

    <div class="card yellow">
      <h3>Lägg till företag</h3>
      <form onsubmit="addCompany(event)">
        <label>Företagsnamn</label>
        <input name="name" required>

        <label>Telefonnummer</label>
        <input name="phone">

        <label>Antal APL-platser</label>
        <input name="capacity" type="number"
          min="0" value="1">

        <label>Status</label>
        <select name="status">
          <option>Inte kontaktad</option>
          <option>Kontaktad</option>
          <option>Tackat ja</option>
          <option>Tackat nej</option>
        </select>

        <button class="btn">Spara företag</button>
      </form>
    </div>

    ${data.companies.map(c=>`
      <div class="card">
        <h3>${safe(c.name)}</h3>
        <p>Telefon: ${safe(c.phone)}</p>
        <p>Platser: ${Number(c.capacity)||0}</p>
        <p>Status:
          <span class="status">${safe(c.status)}</span>
        </p>

        <h3>Handledare</h3>

        ${data.supervisors
          .filter(h=>h.companyId===c.id)
          .map(h=>`
            <div class="item">
              <strong>${safe(h.name)}</strong>
              <p>
                ${safe(h.job)}<br>
                ${safe(h.phone)}<br>
                ${safe(h.email)}
              </p>
            </div>
          `).join("")||
          "<p>Ingen handledare registrerad.</p>"}

        <form onsubmit="addSupervisor(event,'${c.id}')">
          <label>Handledarens namn</label>
          <input name="name" required>

          <div class="fields">
            <div>
              <label>Telefon</label>
              <input name="phone">
            </div>
            <div>
              <label>E-post</label>
              <input name="email" type="email">
            </div>
          </div>

          <label>Yrkesroll</label>
          <input name="job">

          <button class="btn alt">
            Lägg till handledare
          </button>
        </form>
      </div>
    `).join("")}
  `;
}

function addCompany(e){
  e.preventDefault();
  const f=new FormData(e.target);

  data.companies.push({
    id:id(),
    name:f.get("name"),
    phone:f.get("phone"),
    capacity:Number(f.get("capacity")),
    status:f.get("status")
  });

  save();
  render();
}

function addSupervisor(e,cid){
  e.preventDefault();
  const f=new FormData(e.target);

  data.supervisors.push({
    id:id(),
    companyId:cid,
    name:f.get("name"),
    phone:f.get("phone"),
    email:f.get("email"),
    job:f.get("job")
  });

  save();
  render();
}

function studentsView(){
  return `
    ${back()}
    <h2>Elever</h2>

    <div class="card yellow">
      <label>Välj klass</label>
      <select onchange="showGroup(this.value)">
        <option value="all">Alla klasser</option>
        ${Object.keys(groups).map(g=>`
          <option value="${g}">${g}</option>
        `).join("")}
      </select>
    </div>

    <div id="studentList">${studentRows("all")}</div>
  `;
}

function showGroup(group){
  el("studentList").innerHTML=studentRows(group);
}

function studentRows(group){
  return `
    <div class="card">
      ${data.students
        .filter(s=>group==="all"||s.group===group)
        .map(s=>`
          <div class="item row">
            <div>
              <strong>${safe(s.name)}</strong>
              <div class="muted">
                ${safe(company(s.companyId)?.name||
                  "Ingen APL-plats")}
              </div>
            </div>
            <button class="btn alt"
              onclick="selected='${s.id}';go('detail')">
              Öppna
            </button>
          </div>
        `).join("")}
    </div>
  `;
}

function detailView(){
  const s=pupil(selected);

  const available=data.supervisors.filter(
    h=>h.companyId===s.companyId
  );

  return `
    ${back()}
    <h2>${safe(s.name)}</h2>

    <div class="card yellow">
      <h3>APL-placering</h3>
      <p>Planerade veckor:
        ${groups[s.group].join(", ")}
      </p>

      <label>Företag</label>
      <select onchange="assignCompany(this.value)">
        <option value="">Ingen placering</option>
        ${options(data.companies,s.companyId,c=>c.name)}
      </select>

      <label>Handledare</label>
      <select onchange="assignSupervisor(this.value)">
        <option value="">Välj handledare</option>
        ${options(available,s.supervisorId,h=>h.name)}
      </select>

      <p class="muted">
        Placeringen måste kontrolleras mot
        företagets kapacitet och överenskommelse.
      </p>
    </div>

    <div class="card">
      <h3>APL-underlag</h3>
      ${statusText(s)}
    </div>

    <div class="card">
      <h3>Elevens arbetsmoment</h3>
      ${momentList(s)}
    </div>

    <div class="card sage">
      <h3>Rapporterade timmar</h3>
      <p class="big">${totalHours(s.id)} timmar</p>
      <p class="muted">
        Faktiskt rapporterad tid,
        inte garanterad undervisningstid.
      </p>
    </div>
  `;
}

function assignCompany(cid){
  const s=pupil(selected);

  if(cid){
    const c=company(cid);

    if(c.status!=="Tackat ja"){
      alert("Företaget måste ha tackat ja.");
      render();
      return;
    }

    const used=data.students.filter(other=>
      other.id!==s.id &&
      other.companyId===cid &&
      groups[other.group].some(
        w=>groups[s.group].includes(w)
      )
    ).length;

    if(used>=Number(c.capacity||0)){
      alert("Företaget har inga lediga platser under dessa veckor.");
      render();
      return;
    }
  }

  s.companyId=cid;
  s.supervisorId="";
  save();
  render();
}

function assignSupervisor(hid){
  const s=pupil(selected);
  const h=supervisor(hid);

  if(hid&&(!h||h.companyId!==s.companyId))return;

  s.supervisorId=hid;
  save();
  render();
}

function statusText(s){
  const risk=data.risks.some(r=>r.studentId===s.id);

  const decision=data.decisions.some(
    d=>d.studentId===s.id&&d.approved
  );

  return `
    <p>APL-plats:
      <strong>${s.companyId?"Registrerad":"Saknas"}</strong>
    </p>
    <p>Handledare:

function momentList(s){
  return courseList(s).map(([course])=>`
    <div class="item">
      <h3>${safe(course)}</h3>

      ${(moments[course]||[]).map((m,i)=>{
        const key=s.id+"|"+course+"|"+i;
        const value=data.progress[key]||"";

        return `
          <div class="item">
            <div>${safe(m)}</div>
            <select onchange="setMoment('${safe(key)}',this.value)">
              <option value=""
                ${!value?"selected":""}>
                Inte gjort ännu
              </option>
              <option value="seen"
                ${value==="seen"?"selected":""}>
                Jag har sett det
              </option>
              <option value="done"
                ${value==="done"?"selected":""}>
                Jag har utfört det
              </option>
            </select>
          </div>
        `;
      }).join("")}
    </div>
  `).join("")+
  `<p class="muted">
    Elevens markering är inte ett betyg
    eller en bedömning.
  </p>`;
}

function setMoment(key,value){
  data.progress[key]=value;
  save();
}

function totalHours(sid){
  return Object.entries(data.time)
    .filter(([key])=>key.startsWith(sid+"|"))
    .reduce((sum,[,days])=>
      sum+days.reduce((n,d)=>
        n+(d.status==="present"?
          Number(d.hours)||0:0),0),0);
}

function weekPicker(){

function timeView(){
  const s=pupil(selected);

  if(!groups[s.group].includes(week)){
    week=groups[s.group][0];
  }

  const key=s.id+"|"+week;

  const days=data.time[key]||
    Array.from({length:5},()=>({
      status:"",
      hours:""
    }));

  const names=[
    "Måndag","Tisdag","Onsdag",
    "Torsdag","Fredag"
  ];

  return `
    ${back()}
    <h2>Min tidrapport</h2>

    <div class="card">
      ${weekPicker()}

      <form onsubmit="saveTime(event)">
        ${days.map((d,i)=>`
          <div class="item">
            <h3>${names[i]}</h3>

            <label>Närvaro</label>
            <select name="status${i}">
              <option value=""
                ${!d.status?"selected":""}>Välj</option>
              <option value="present"
                ${d.status==="present"?"selected":""}>
                På APL
              </option>
              <option value="sick"
                ${d.status==="sick"?"selected":""}>
                Sjuk
              </option>
              <option value="absent"
                ${d.status==="absent"?"selected":""}>
                Annan frånvaro
              </option>
              <option value="free"
                ${d.status==="free"?"selected":""}>
                Ledig enligt schema
              </option>
            </select>

            <label>Arbetade timmar, utan rast</label>
            <input name="hours${i}"
              type="number" min="0" max="24"
              step="0.25" value="${safe(d.hours)}">
          </div>
        `).join("")}

        <div class="notice">
          <h3>Viktigt om du är sjuk!</h3>

          <p>
            Ring din handledare eller APL-plats
            och meddela att du inte kommer.
            Sjukanmäl dig också till skolan
            enligt skolans vanliga rutiner.
          </p>

          <p>Telefon:
            <strong>
              ${safe(supervisor(s.supervisorId)?.phone||
                company(s.companyId)?.phone||
                "Kontakta din lärare")}
            </strong>
          </p>

          <label class="check">
            <input type="checkbox" name="called">
            Jag har meddelat APL-platsen vid frånvaro
          </label>
        </div>

        <button class="btn">
          Spara tidrapport
        </button>
      </form>
    </div>

    <div class="card sage">
      <h3>Totalt rapporterad APL-tid</h3>
      <p class="big">${totalHours(s.id)} timmar</p>
    </div>
  `;
}

function saveTime(e){
  e.preventDefault();

  const f=new FormData(e.target);
  const days=[];

  for(let i=0;i<5;i++){
    const status=f.get("status"+i);
    const hours=Number(f.get("hours"+i)||0);

    if(status==="present"&&hours<=0){
      alert("Ange arbetade timmar för närvarodagar.");
      return;
    }

    days.push({
      status,
      hours:status==="present"?hours:0
    });
  }

  const hasAbsence=days.some(d=>
    d.status==="sick"||
    d.status==="absent"
  );

  if(hasAbsence&&!f.has("called")){
    if(!confirm(
      "Har du kommit ihåg att meddela APL-platsen? "+
      "Tidrapporten ersätter inte sjukanmälan."
    ))return;
  }

  data.time[selected+"|"+week]=days;
  save();
  render();

  alert("Tidrapporten är sparad i testversionen.");
}

function weeklyView(){
  const s=pupil(selected);

  if(!groups[s.group].includes(week)){

  }

  const old=data.reports.find(r=>
    r.studentId===selected&&r.week===week

  return `

    <div class="card">
      ${weekPicker()}

      <form onsubmit="saveReport(event)">

        </button>

        <div class="notice sage">

          <p>${safe(old.reply)}</p>

    </div>
  `;
}

function saveReport(e){
  e.preventDefault();

  const f=new FormData(e.target);

  let r=data.reports.find(x=>
    x.studentId===selected&&x.week===week
  );

  if(!r){
    r={
      id:id(),
      studentId:selected,
      week
    };
    data.reports.push(r);
  }

  r.work=f.get("work");
  r.learn=f.get("learn");
  r.help=f.get("help");

  save();
  render();

  alert("Veckorapporten är sparad.");
}
