
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praktiknavet 5.0 – APL utan krångel</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink:#F9E4E9;
  --darkpink:#DDA6B6;
  --card:#F1C9D3;
  --yellow:#FBE9AB;
  --sage:#E1E5CF;
  --text:#533B46;
  --button:#A45368;
  --border:#DDB7C2;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--pink);
  color:var(--text);
  font-family:Quicksand,Arial,sans-serif;
  font-size:15px;
}
header {
  background:var(--darkpink);
  padding:24px 20px;
}
.header-inner {
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.logo {font-size:34px;font-weight:700}
.subtitle {font-size:11px;letter-spacing:2px;font-weight:700}
main {max-width:1100px;margin:25px auto;padding:0 18px 50px}
h1 {font-size:29px;margin:0 0 8px}
h2 {font-size:24px;margin:0 0 15px}
h3 {font-size:19px;margin:0 0 12px}
p {line-height:1.6}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
  margin:20px 0;
}
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  padding:22px;
  margin-bottom:16px;
}
.yellow {background:var(--yellow)}
.sage {background:var(--sage)}
.white {background:#FFF7F8}
.tile {
  border:1px solid var(--border);
  border-radius:19px;
  padding:25px;
  text-align:left;
  background:var(--card);
  color:var(--text);
  font:inherit;
  cursor:pointer;
  min-height:120px;
}
.tile:nth-child(3n+2) {background:var(--yellow)}
.tile:nth-child(3n+3) {background:var(--sage)}
.tile strong {font-size:20px;display:block}
.tile small {display:block;margin-top:8px}
button {
  font-family:inherit;
  cursor:pointer;
}
.btn {
  background:var(--button);
  color:white;
  border:0;
  border-radius:12px;
  padding:11px 17px;
  font-size:14px;
  font-weight:700;
  margin:5px 5px 5px 0;
}
.btn.alt {background:var(--yellow);color:var(--text)}
.btn.light {background:#F5D7DF;color:var(--text)}
.btn.small {padding:7px 11px;font-size:12px}
input,select,textarea {
  width:100%;
  padding:11px;
  border:1px solid #D6AEBB;
  border-radius:11px;
  background:#FFF7F8;
  color:var(--text);
  font:inherit;
}
input[type=checkbox] {width:auto}
textarea {min-height:85px;resize:vertical}
label {
  display:block;
  font-weight:700;
  margin:12px 0 5px;
  font-size:13px;
}
.fields {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
}
.item {
  padding:15px 0;
  border-bottom:1px solid var(--border);
}
.item:last-child {border-bottom:0}
.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
.muted {font-size:13px;color:#785D68}
.badge {
  display:inline-block;
  background:var(--yellow);
  border-radius:20px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700;
}
.badge.green {background:var(--sage)}
.big {font-size:30px;font-weight:700}
.notice {
  padding:16px;
  background:var(--yellow);
  border-radius:14px;
  margin:15px 0;
}
.tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}
.tabs button {
  border:1px solid var(--border);
  background:#FFF7F8;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
}
.tabs button.active {background:var(--button);color:white}
footer {text-align:center;padding:25px;font-size:12px}
@media(max-width:600px) {
  .grid {grid-template-columns:1fr}
  .logo {font-size:28px}
  .card {padding:16px}
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div>
      <div class="logo">Praktiknavet 💗</div>
      <div class="subtitle">APL UTAN KRÅNGEL</div>
    </div>
    <div>
      <label>Visa som</label>
      <select id="role" onchange="changeRole(this.value)">
        <option value="teacher">Lärare</option>
        <option value="student">Elev</option>
        <option value="supervisor">Handledare</option>
      </select>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  Praktiknavet 5.0 · Testversion med fiktiva uppgifter
</footer>

<script>
"use strict";

const KEY="praktiknavet-test-4-simple";

const statuses=[
  "Inte kontaktad",
  "Väntar på svar",
  "Tackat ja",
  "Tackat nej"
];

function id(){
  return Date.now().toString(36)+
    Math.random().toString(36).slice(2,8);
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function defaults(){
  return {
    companies:[],
    supervisors:[],
    students:[],
    reports:[],
    visits:[],
    risks:[],
    decisions:[],
    time:{},
    progress:{},
    contactLogs:[],
    periodPlaces:[],
    tasks:[]
  };
}

let data=defaults();

try {
  const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
  for(const key of Object.keys(data)){
    if(saved[key]!==undefined){
      data[key]=saved[key];
    }
  }
} catch(error){
  console.error("Kunde inte läsa tidigare data",error);
}

for(const key of [
  "companies","supervisors","students",
  "reports","visits","risks","decisions",
  "contactLogs","periodPlaces","tasks"
]){
  if(!Array.isArray(data[key]))data[key]=[];
}

let role="teacher";
let page="home";
let selectedCompany="";
let selectedStudent=data.students[0]?.id||"";
let searchText="";
let statusFilter="Alla";
let schoolYear="2026/2027";
let semester="HT";

const app=document.getElementById("app");

function save(){
  try {
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  } catch(error){
    alert("Det gick inte att spara i webbläsaren.");
    return false;
  }
}

function company(cid){
  return data.companies.find(c=>c.id===cid);
}

function student(sid){
  return data.students.find(s=>s.id===sid);
}

function supervisor(hid){
  return data.supervisors.find(h=>h.id===hid);
}

function changeRole(value){
  role=value;
  page="home";
  render();
}

function go(target){
  page=target;
  render();
  window.scrollTo(0,0);
}

function back(){
  return `<button class="btn light"
    onclick="go('home')">Tillbaka</button>`;
}

function tile(title,description,target){
  return `<button class="tile" onclick="go('${target}')">
    <strong>${title}</strong>
    <small>${description}</small>
  </button>`;
}

function render(){
  if(role==="teacher")app.innerHTML=teacherView();
  if(role==="student")app.innerHTML=studentView();
  if(role==="supervisor")app.innerHTML=supervisorView();
}

/* STARTSIDA */

function teacherView(){
  if(page==="home")return `
    <h1>Hej och välkommen! 💗</h1>
    <p>Vad vill du göra idag?</p>

    <div class="grid">
      ${tile("Företag","Kontakter, platser och handledare","companies")}
      ${tile("Elever","Placeringar och APL","students")}
      ${tile("Att göra","Det som behöver följas upp","todo")}
      ${tile("Veckorapporter","Elevernas rapporter","reports")}
      ${tile("APL-besök","Besök och anteckningar","visits")}
      ${tile("Riskbedömning","Underlag för arbetsmiljö","risks")}
      ${tile("APL-beslut","Samråd och beslut","decisions")}
      ${tile("Säkerhetskopiering","Spara och återställ","backup")}
    </div>

    <div class="card sage">
      <h3>Snabb överblick</h3>
      <p>Företag: <strong>${data.companies.length}</strong></p>
      <p>Elever: <strong>${data.students.length}</strong></p>
      <p>Uppföljningar: <strong>${openTasks().length}</strong></p>
    </div>

    <div class="notice">
      <strong>Testversion!</strong>
      <p>Ingen riktig inloggning eller gemensam databas finns ännu.
      Använd endast påhittade uppgifter.</p>
    </div>
  `;

  if(page==="companies")return companiesView();
  if(page==="companyDetail")return companyDetailView();
  if(page==="students")return studentsView();
  if(page==="studentDetail")return studentDetailView();
  if(page==="todo")return todoView();
  if(page==="reports")return reportsView();
  if(page==="visits")return visitsView();
  if(page==="risks")return risksView();
  if(page==="decisions")return decisionsView();
  if(page==="backup")return backupView();

  return back();
}

/* FÖRETAGSBANK */

function companiesView(){
  const filtered=data.companies.filter(c=>{
    const matchesName=c.name.toLowerCase()
      .includes(searchText.toLowerCase());
    const status=getPeriod(c.id)?.status||
      normalizeStatus(c.status);
    const matchesStatus=statusFilter==="Alla"||
      status===statusFilter;
    return matchesName&&matchesStatus;
  });

  return `
    ${back()}
    <h2>Företagsbanken 💗</h2>
    <p>Alla företag på ett ställe. Enkelt och tydligt.</p>

    <div class="card yellow">
      <h3>Vilken APL-period arbetar du med?</h3>
      ${periodControls()}
    </div>

    <div class="card">
      <h3>Lägg till företag</h3>
      <form onsubmit="addCompany(event)">
        <label>Företagsnamn</label>
        <input name="name" required>

        <div class="fields">
          <div>
            <label>Telefon</label>
            <input name="phone">
          </div>
          <div>
            <label>E-post</label>
            <input name="email" type="email">
          </div>
        </div>

        <label>Adress</label>
        <input name="address">

        <label>Huvudkontakt, exempelvis chef</label>
        <input name="contactName">

        <button class="btn">Spara företag</button>
      </form>
    </div>

    <div class="card sage">
      <h3>Hitta företag</h3>

      <label>Sök</label>
      <input value="${escapeHTML(searchText)}"
        oninput="searchText=this.value;refreshCompanyList()"
        placeholder="Skriv företagsnamn...">

      <label>Visa</label>
      <select onchange="statusFilter=this.value;refreshCompanyList()">
        ${["Alla",...statuses].map(s=>`
          <option ${s===statusFilter?"selected":""}>
            ${s}
          </option>
        `).join("")}
      </select>
    </div>

    <div id="companyList">
      ${companyCards(filtered)}
    </div>
  `;
}

function normalizeStatus(value){
  if(value==="Kontaktad")return "Väntar på svar";
  return statuses.includes(value)?value:"Inte kontaktad";
}

function periodControls(){
  return `
    <div class="fields">
      <div>
        <label>Läsår</label>
        <select onchange="schoolYear=this.value;render()">
          ${[
            "2025/2026",
            "2026/2027",
            "2027/2028",
            "2028/2029",
            "2029/2030"
          ].map(y=>`
            <option ${y===schoolYear?"selected":""}>${y}</option>
          `).join("")}
        </select>
      </div>
      <div>
        <label>Termin</label>
        <select onchange="semester=this.value;render()">
          <option value="HT" ${semester==="HT"?"selected":""}>
            Hösttermin
          </option>
          <option value="VT" ${semester==="VT"?"selected":""}>
            Vårtermin
          </option>
        </select>
      </div>
    </div>
  `;
}

function getPeriod(cid){
  return data.periodPlaces.find(p=>
    p.companyId===cid &&
    p.schoolYear===schoolYear &&
    p.semester===semester
  );
}

function companyCards(items){
  if(!items.length)return `
    <div class="card">Inga företag hittades.</div>
  `;

  return items.map(c=>{
    const p=getPeriod(c.id);
    const offered=p?Number(p.places)||0:0;
    const occupied=data.students.filter(s=>
      s.companyId===c.id
    ).length;

    return `
      <div class="card">
        <div class="row">
          <div>
            <h3>${escapeHTML(c.name)}</h3>
            <span class="badge ${p?.status==="Tackat ja"?"green":""}">
              ${escapeHTML(p?.status||"Inte kontaktad")}
            </span>
          </div>
          <button class="btn"
            onclick="selectedCompany='${c.id}';go('companyDetail')">
            Öppna
          </button>
        </div>

        <p>Telefon: ${escapeHTML(c.phone||"Saknas")}</p>

        <p>
          <strong>${schoolYear} ${semester}</strong><br>
          Erbjudna platser: ${offered}<br>
          Elever kopplade till företaget totalt: ${occupied}
        </p>
      </div>
    `;
  }).join("");
}

function refreshCompanyList(){
  const filtered=data.companies.filter(c=>{
    const status=getPeriod(c.id)?.status||
      "Inte kontaktad";
    return c.name.toLowerCase()
      .includes(searchText.toLowerCase()) &&
      (statusFilter==="Alla"||status===statusFilter);
  });
  document.getElementById("companyList").innerHTML=
    companyCards(filtered);
}

function addCompany(event){
  event.preventDefault();
  const f=new FormData(event.target);
  const name=String(f.get("name")).trim();

  if(data.companies.some(c=>
    c.name.toLowerCase()===name.toLowerCase()
  )){
    alert("Företaget finns redan i registret.");
    return;
  }

  data.companies.push({
    id:id(),
    name,
    phone:f.get("phone"),
    email:f.get("email"),
    address:f.get("address"),
    contactName:f.get("contactName"),
    status:"Inte kontaktad",
    capacity:0
  });

  if(save())render();
}

/* FÖRETAGETS EGEN SIDA */

function companyDetailView(){
  const c=company(selectedCompany);
  if(!c)return back()+"Företaget hittades inte.";

  const p=getPeriod(c.id);
  const logs=data.contactLogs
    .filter(l=>l.companyId===c.id)
    .sort((a,b)=>String(b.created).localeCompare(String(a.created)));

  const handlers=data.supervisors
    .filter(h=>h.companyId===c.id);

  return `
    <button class="btn light" onclick="go('companies')">
      Tillbaka till företagen
    </button>

    <h2>${escapeHTML(c.name)}</h2>

    <div class="tabs">
      <button class="active">Företagsuppgifter</button>
      <button onclick="document.getElementById('places').scrollIntoView()">
        APL-platser
      </button>
      <button onclick="document.getElementById('contacts').scrollIntoView()">
        Kontaktlogg
      </button>
      <button onclick="document.getElementById('handlers').scrollIntoView()">
        Handledare
      </button>
    </div>

    <div class="card">
      <h3>Företagsuppgifter</h3>
      <form onsubmit="updateCompany(event)">
        <label>Företagsnamn</label>
        <input name="name" value="${escapeHTML(c.name)}" required>

        <div class="fields">
          <div>
            <label>Telefon</label>
            <input name="phone" value="${escapeHTML(c.phone)}">
          </div>
          <div>
            <label>E-post</label>
            <input name="email" type="email"
              value="${escapeHTML(c.email)}">
          </div>
        </div>

        <label>Adress</label>
        <input name="address" value="${escapeHTML(c.address)}">

        <label>Huvudkontakt</label>
        <input name="contactName"
          value="${escapeHTML(c.contactName)}">

        <button class="btn">Spara ändringar</button>
      </form>
    </div>

    <div class="card yellow" id="places">
      <h3>APL-platser</h3>
      ${periodControls()}

      <p class="muted">
        Platserna sparas separat för varje termin och läsår.
      </p>

      <form onsubmit="savePeriod(event)">
        <label>Hur många platser erbjuder företaget?</label>
        <input type="number" name="places" min="0"
          value="${p?Number(p.places)||0:0}">

        <label>Status</label>
        <select name="status">
          ${statuses.map(s=>`
            <option ${s===(p?.status||"Inte kontaktad")?"selected":""}>
              ${s}
            </option>
          `).join("")}
        </select>

        <label>Kommentar om platserna</label>
        <textarea name="notes">${escapeHTML(p?.notes)}</textarea>

        <button class="btn">Spara APL-platser</button>
      </form>
    </div>

    <div class="card sage" id="contacts">
      <h3>Kontaktlogg 💗</h3>
      <p>Här skriver ni när någon har pratat med företaget.</p>

      <form onsubmit="addContact(event)">
        <label>Vem kontaktade företaget?</label>
        <input name="author" required
          placeholder="Lärarens namn">

        <label>Hur kontaktades företaget?</label>
        <select name="method">
          <option>Telefon</option>
          <option>E-post</option>
          <option>Besök</option>
          <option>Annat</option>
        </select>

        <label>Vad kom ni fram till?</label>
        <textarea name="notes" required
          placeholder="Skriv en kort anteckning..."></textarea>

        <label>Följ upp den</label>
        <input name="followUp" type="date">

        <button class="btn">Spara kontakt</button>
      </form>

      <h3 style="margin-top:25px">Tidigare kontakter</h3>

      ${logs.length?logs.map(l=>`
        <div class="item">
          <strong>${escapeHTML(l.author)}</strong>
          <span class="muted">
            ${escapeHTML(formatDate(l.created))}
          </span>
          <p>${escapeHTML(l.method)}</p>
          <p>${escapeHTML(l.notes)}</p>
          ${l.followUp?`
            <p><strong>Följ upp:</strong>
              ${escapeHTML(l.followUp)}
            </p>
          `:""}
        </div>
      `).join(""):"<p>Ingen kontakt registrerad ännu.</p>"}
    </div>

    <div class="card" id="handlers">
      <h3>Handledare</h3>

      ${handlers.length?handlers.map(h=>`
        <div class="item">
          <strong>${escapeHTML(h.name)}</strong>
          <p>${escapeHTML(h.job||"VVS-montör")}</p>
          <p>${escapeHTML(h.phone)}</p>
          <p>${escapeHTML(h.email)}</p>
        </div>
      `).join(""):"<p>Ingen handledare registrerad.</p>"}

      <h3 style="margin-top:20px">Lägg till handledare</h3>
      <form onsubmit="addSupervisor(event)">
        <label>Namn</label>
        <input name="name" required>

        <div class="fields">
          <div>
            <label>Telefon</label>
            <input name="phone">
          </div>
          <div>
            <label>E-post</label>
            <input name="email" type="email">
          </div>
        </div>

        <label>Yrkesroll</label>
        <input name="job" placeholder="VVS-montör">

        <button class="btn">Spara handledare</button>
      </form>
    </div>
  `;
}

function updateCompany(event){
  event.preventDefault();
  const c=company(selectedCompany);
  if(!c)return;

  const f=new FormData(event.target);

  for(const field of [
    "name","phone","email","address","contactName"
  ]){
    c[field]=String(f.get(field)||"").trim();
  }

  if(save())render();
}

function savePeriod(event){
  event.preventDefault();
  const f=new FormData(event.target);

  let p=getPeriod(selectedCompany);

  if(!p){
    p={
      id:id(),
      companyId:selectedCompany,
      schoolYear,
      semester
    };
    data.periodPlaces.push(p);
  }

  p.places=Number(f.get("places"))||0;
  p.status=f.get("status");
  p.notes=f.get("notes");

  if(save())render();
}

function addSupervisor(event){
  event.preventDefault();
  const f=new FormData(event.target);

  data.supervisors.push({
    id:id(),
    companyId:selectedCompany,
    name:f.get("name"),
    phone:f.get("phone"),
    email:f.get("email"),
    job:f.get("job")
  });

  if(save())render();
}

function addContact(event){
  event.preventDefault();
  const f=new FormData(event.target);

  data.contactLogs.push({
    id:id(),
    companyId:selectedCompany,
    author:f.get("author"),
    method:f.get("method"),
    notes:f.get("notes"),
    followUp:f.get("followUp"),
    created:new Date().toISOString()
  });

  if(save())render();
}

function formatDate(value){
  if(!value)return "";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?String(value):
    d.toLocaleString("sv-SE");
}

/* ATT GÖRA */

function openTasks(){
  const today=new Date().toISOString().slice(0,10);

  return data.contactLogs
    .filter(l=>l.followUp && l.followUp<=today)
    .filter(l=>!data.tasks.some(t=>
      t.contactId===l.id && t.done
    ));
}

function todoView(){
  const pending=openTasks();

  return `
    ${back()}
    <h2>Att göra 💗</h2>

    <div class="card yellow">
      <h3>Företag att följa upp</h3>

      ${pending.length?pending.map(l=>`
        <div class="item">
          <strong>
            ${escapeHTML(company(l.companyId)?.name||"Företag")}
          </strong>
          <p>Följ upp senast: ${escapeHTML(l.followUp)}</p>
          <p>${escapeHTML(l.notes)}</p>

          <button class="btn"
            onclick="selectedCompany='${l.companyId}';go('companyDetail')">
            Öppna företaget
          </button>

          <button class="btn alt"
            onclick="completeTask('${l.id}')">
            Markera klar
          </button>
        </div>
      `).join(""):"<p>Inga förfallna uppföljningar just nu. 💗</p>"}
    </div>

    <div class="card sage">
      <h3>Företag som väntar på svar</h3>
      ${data.companies.filter(c=>
        getPeriod(c.id)?.status==="Väntar på svar"
      ).map(c=>`
        <div class="item row">
          <strong>${escapeHTML(c.name)}</strong>

      <p>Läs in en tidigare sparad JSON-fil.</p>
      <button class="btn" onclick="restoreBackup()">
        Återställ säkerhetskopia
      </button>
    </div>

    <div class="notice">
      Säkerhetskopian ska inte öppnas eller redigeras i Word.
      Förvara filen säkert och behåll ändelsen .json.
    </div>
  `;
}

function downloadBackup(){
  const backup={
    application:"Praktiknavet",
    version:2,
    created:new Date().toISOString(),
    data
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="praktiknavet-sakerhetskopia-"+
    new Date().toISOString().slice(0,10)+".json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function restoreBackup(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json";

  input.onchange=async()=>{
    if(!input.files.length)return;

    try {
      const backup=JSON.parse(await input.files[0].text());

      if(
        backup.application!=="Praktiknavet"||
        !backup.data||
        !Array.isArray(backup.data.companies)||
        !Array.isArray(backup.data.students)
      ){
        throw new Error("Felaktig fil");
      }

      if(!confirm(
        "Vill du återställa säkerhetskopian?\n"+
        "Nuvarande uppgifter ersätts."
      ))return;

      localStorage.setItem(
        KEY,JSON.stringify(backup.data)
      );

      alert("Säkerhetskopian är återställd!");
      location.reload();

    } catch(error){
      alert("Det gick inte att läsa säkerhetskopian.");
    }
  };

  input.click();
}

function timeView(s){
  const total=Object.entries(data.time)
    .filter(([key])=>key.startsWith(s.id+"|"))
    .reduce((sum,[,days])=>{
      if(!Array.isArray(days))return sum;
      return sum+days.reduce((n,d)=>
        n+(d.status==="present"?(Number(d.hours)||0):0),0);
    },0);

  return `
    ${back()}
    <h2>Min tidrapport</h2>

    <div class="card">
      <form onsubmit="saveTime(event)">
        <label>Vecka</label>
        <input name="week" type="number" min="1" max="53" required>

        ${["Måndag","Tisdag","Onsdag","Torsdag","Fredag"]
          .map((day,i)=>`
          <div class="item">
            <h3>${day}</h3>

            <label>Närvaro</label>
            <select name="status${i}">
              <option value="">Välj</option>
              <option value="present">På APL</option>
              <option value="sick">Sjuk</option>
              <option value="absent">Annan frånvaro</option>
              <option value="free">Ledig enligt schema</option>
            </select>

            <label>Arbetade timmar, utan rast</label>
            <input name="hours${i}" type="number"
              min="0" max="24" step="0.25" value="0">
          </div>
        `).join("")}

        <div class="notice">
          <strong>Om du är sjuk</strong>
          <p>Kontakta både din APL-plats och skolan enligt
          vanliga rutiner. Tidrapporten ersätter inte sjukanmälan.</p>
        </div>

        <button class="btn">Spara tidrapport</button>
      </form>
    </div>

    <div class="card sage">
      <h3>Totalt registrerade timmar</h3>
      <div class="big">${total}</div>
    </div>
  `;
}

function saveTime(event){
  event.preventDefault();
  const f=new FormData(event.target);
  const week=Number(f.get("week"));
  const days=[];

  for(let i=0;i<5;i++){
    const status=f.get("status"+i);
    const hours=Number(f.get("hours"+i))||0;

    if(status==="present"&&hours<=0){
      alert("Ange timmar för närvarodagar.");
      return;
    }

    days.push({
      status,
      hours:status==="present"?hours:0
    });
  }

  data.time[selectedStudent+"|"+week]=days;

  if(save()){
    alert("Tidrapporten är sparad.");
    go("home");
  }
}
