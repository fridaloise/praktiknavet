

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praktiknavet – APL utan krångel</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink:#F9E4E9;
  --card:#F1C9D3;
  --header:#DDA6B6;
  --deep:#A45368;
  --yellow:#F5DA83;
  --lightyellow:#FBE9AB;
  --sage:#E1E5CF;
  --ink:#533B46;
  --line:#DDB7C2;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--pink);color:var(--ink);
  font-family:Quicksand,sans-serif;font-size:15px;
  line-height:1.55;font-weight:500;
}
header {background:var(--header);padding:22px 20px}
.header-inner {
  max-width:1120px;margin:auto;display:flex;
  justify-content:space-between;align-items:center;
  gap:15px;flex-wrap:wrap;
}
.brand {font-size:34px;font-weight:700;letter-spacing:-1px}
.subtitle {font-size:11px;letter-spacing:2px;font-weight:700}
main {max-width:1120px;margin:25px auto;padding:0 18px 40px}
h1 {font-size:29px;margin:0 0 8px}
h2 {font-size:25px;margin:0 0 15px}
h3 {font-size:19px;margin:0 0 12px}
p {margin:8px 0 14px}
.grid {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;margin:15px 0 25px;
}
.tile,.card {
  border:1px solid var(--line);border-radius:20px;
  padding:23px;color:var(--ink);
}
.tile {text-align:left;min-height:125px;cursor:pointer}
.tile strong {display:block;font-size:20px}
.tile small {display:block;margin-top:8px;font-family:Quicksand,sans-serif;font-size:13px;font-weight:600}
.card {background:var(--card);margin-bottom:16px}
.yellow {background:var(--lightyellow)}
.sage {background:var(--sage)}
.tile-pink {background:var(--card)}
.tile-yellow {background:var(--yellow)}
.tile-sage {background:var(--sage)}
.btn {
  background:var(--deep);color:white;border:0;
  border-radius:12px;padding:11px 17px;
  font:700 14px Quicksand;cursor:pointer;
  margin:5px 5px 5px 0;
}
.btn.alt {background:var(--yellow);color:var(--ink)}
.btn.back {background:var(--card);color:var(--ink);margin-bottom:20px}
.btn:disabled {opacity:.5;cursor:not-allowed}
label {display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select,textarea {
  display:block;width:100%;padding:11px;
  border:1px solid #D6AEBB;border-radius:11px;
  background:#F7DDE4;color:var(--ink);
  font:inherit;
}
textarea {min-height:85px;resize:vertical}
input[type=checkbox] {width:auto;display:inline}
.fields {
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
.item {padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child {border-bottom:0}
.row {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted {color:#725A65;font-size:13px}
.notice {
  background:var(--lightyellow);padding:16px;
  border-radius:15px;margin:16px 0;
}
.status {
  display:inline-block;padding:5px 10px;border-radius:20px;
  background:var(--yellow);font-size:12px;font-weight:700;
}
.status.good {background:var(--sage)}
.big {font-size:30px;font-weight:700;color:#8D465B}
.actions {display:flex;gap:8px;flex-wrap:wrap}
footer {text-align:center;padding:25px;font-size:12px;color:#725A65}
table {width:100%;border-collapse:collapse}
td,th {padding:10px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:600px) {
  .brand {font-size:28px}
  main {padding:0 12px}
  .tile,.card {padding:16px}
  .tile strong {font-size:17px}
}
@media print {
  header,footer,.btn,.no-print {display:none!important}
  body {background:white!important;color:#222!important}
  main {max-width:none;margin:0;padding:0}
  #decision-print-sheet {border:0!important;margin:0;padding:0}
  #decision-print-sheet tr {break-inside:avoid}
}
</style>
</head>
<body>

function defaults(){
  const students=[];

try {

} catch(e) {

if(!Array.isArray(data.students))data.students=defaults().students;

if(!data.time || typeof data.time!=="object")data.time={};

let role="teacher";
let page="home";
let selected=data.students[0]?.id||"";
let selectedSupervisor=data.supervisors[0]?.id||"";
let week=3;
let companySearch="";
let companyFilter="Alla";
let aplPeriod="HT 2026";

const el=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pupil=id=>data.students.find(s=>s.id===id);
const company=id=>data.companies.find(c=>c.id===id);
const supervisor=id=>data.supervisors.find(h=>h.id===id);
const courseList=s=>courses[s.group.slice(0,5)]||[];

function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function save(){
  try {
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  } catch(e) {
    alert("Det gick inte att spara i webbläsaren. Kontrollera lagringsutrymmet.");
    return false;
  }
}

function options(items,value,label){
  return items.map(x=>`
    <option value="${safe(x.id)}" ${x.id===value?"selected":""}>
      ${safe(label(x))}
    </option>
  `).join("");
}

function changeRole(value){
  role=value;page="home";render();
}
function go(value){
  page=value;render();window.scrollTo(0,0);
}
function back(){
  return `<button class="btn back" onclick="go('home')">Tillbaka</button>`;
}
function tile(name,desc,target,color){
  return `<button class="tile ${color}" onclick="go('${target}')">
    <strong>${name}</strong><small>${desc}</small>
  </button>`;
}

function render(){
  el("app").innerHTML=role==="teacher"
    ?teacherView()
    :role==="student"?studentView():supervisorView();
}

/* SÄKERHETSKOPIERING */

function downloadBackup(){
  try {
    const backup={
      application:"Praktiknavet",
      version:1,
      created:new Date().toISOString(),
      data:JSON.parse(JSON.stringify(data))
    };
    const blob=new Blob(
      [JSON.stringify(backup,null,2)],
      {type:"application/json"}
    );
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="praktiknavet-sakerhetskopia-"+
      new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch(e) {
    alert("Det gick inte att skapa säkerhetskopian.");
  }
}

function restoreBackup(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json";
  input.onchange=async()=>{
    if(!input.files?.length)return;
    try {
      const backup=JSON.parse(await input.files[0].text());
      if(
        backup.application!=="Praktiknavet" ||
        backup.version!==1 ||
        !backup.data ||
        !Array.isArray(backup.data.students) ||
        !Array.isArray(backup.data.companies) ||
        !Array.isArray(backup.data.supervisors) ||
        !Array.isArray(backup.data.reports) ||
        !Array.isArray(backup.data.risks) ||
        !Array.isArray(backup.data.decisions) ||
        !Array.isArray(backup.data.visits) ||
        !backup.data.time ||
        !backup.data.progress
      ){
        throw new Error("Felaktig säkerhetskopia");
      }
      if(!confirm(
        "Vill du återställa säkerhetskopian?\n\n"+
        "Nuvarande uppgifter i webbläsaren ersätts.\n"+
        "Spara gärna en kopia av dem först."
      ))return;
      localStorage.setItem(KEY,JSON.stringify(backup.data));
      alert("Säkerhetskopian är återställd!");
      location.reload();
    } catch(e) {
      alert("Kunde inte återställa filen. Kontrollera att det är en giltig säkerhetskopia.");
    }
  };
  input.click();
}

    <div class="card sage">
      <h3>Hitta företag</h3>

function updateCompanyList(){
  const filtered=data.companies.filter(c=>
    c.name.toLowerCase().includes(companySearch.toLowerCase()) &&
    (companyFilter==="Alla"||c.status===companyFilter)
  );
  el("company-list").innerHTML=companyCards(filtered);
}

function companyCards(items){

  return items.map(c=>`
    <div class="card">
      <h3>${safe(c.name)}</h3>
      <p>Telefon: ${safe(c.phone)||"Saknas"}</p>
      <p>APL-platser (grundantal): ${Number(c.capacity)||0}</p>
      <h3>Huvudkontakt</h3>
      <form onsubmit="saveMainContact(event,'${c.id}')">
        <div class="fields">
          <div><label>Namn</label><input name="contactName" value="${safe(c.contactName)}"></div>
          <div><label>Telefon</label><input name="contactPhone" value="${safe(c.contactPhone)}"></div>
          <div><label>E-post</label><input name="contactEmail" type="email" value="${safe(c.contactEmail)}"></div>
        </div>
        <button class="btn alt">Spara huvudkontakt</button>
      </form>
      <h3>APL-platser per termin</h3>
      <form onsubmit="saveCapacity(event,'${c.id}')">
        <div class="fields">
          <div><label>Termin</label><select name="period">${["HT 2026","VT 2027","HT 2027","VT 2028","HT 2028","VT 2029"].map(p=>`<option>${p}</option>`).join("")}</select></div>
          <div><label>Antal platser</label><input type="number" min="0" name="count" value="0" required></div>
        </div>
        <button class="btn alt">Spara platser</button>
      </form>
      ${data.capacities.filter(x=>x.companyId===c.id).map(x=>`<p>${safe(x.period)}: <strong>${Number(x.count)||0} platser</strong></p>`).join("")||'<p class="muted">Inga terminsplatser registrerade.</p>'}
      <h3>Kontaktanteckningar</h3>
      <form onsubmit="addContactLog(event,'${c.id}')">
        <div class="fields">
          <div><label>Datum</label><input name="date" type="date" required></div>
          <div><label>Antecknat av</label><input name="author" required></div>
        </div>
        <label>Vad pratade ni om?</label><textarea name="notes" required></textarea>
        <button class="btn alt">Spara anteckning</button>
      </form>
      ${data.contactLogs.filter(x=>x.companyId===c.id).slice().reverse().map(x=>`<div class="item"><strong>${safe(x.date)} – ${safe(x.author)}</strong><p>${safe(x.notes)}</p></div>`).join("")||'<p class="muted">Inga anteckningar ännu.</p>'}

        ${safe(c.status)}
      </span></p>
      <form onsubmit="updateCompany(event,'${c.id}')">
        <div class="fields">
          <div>
            <label>Ändra antal platser</label>
            <input name="capacity" type="number" min="0"
              value="${Number(c.capacity)||0}">
          </div>
          <div>
            <label>Ändra status</label>
            <select name="status">
              ${["Inte kontaktad","Kontaktad","Väntar på svar","Tackat ja","Tackat nej"].map(s=>
                `<option ${s===c.status?"selected":""}>${s}</option>`
              ).join("")}
            </select>
          </div>
        </div>
        <button class="btn alt">Uppdatera företag</button>
      </form>
      <h3 style="margin-top:20px">Handledare</h3>
      ${data.supervisors.filter(h=>h.companyId===c.id).map(h=>`
        <div class="item">
          <strong>${safe(h.name)}</strong>
          <p>${safe(h.job)}<br>${safe(h.phone)}<br>${safe(h.email)}</p>
        </div>
      `).join("")||"<p>Ingen handledare registrerad.</p>"}
      <form onsubmit="addSupervisor(event,'${c.id}')">
        <label>Handledarens namn</label>
        <input name="name" required>
        <div class="fields">
          <div><label>Telefon</label><input name="phone"></div>
          <div><label>E-post</label><input name="email" type="email"></div>
        </div>
        <label>Yrkesroll</label>
        <input name="job" placeholder="Exempel: VVS-montör">
        <button class="btn alt">Lägg till handledare</button>
      </form>
    </div>
  `).join("");
}

function addCompany(e){
  e.preventDefault();
  const f=new FormData(e.target);
  data.companies.push({
    id:uid(),name:String(f.get("name")).trim(),
    phone:f.get("phone"),capacity:Number(f.get("capacity"))||0,
    status:f.get("status")
  });
  if(save())render();
}

function updateCompany(e,cid){
  e.preventDefault();
  const c=company(cid);
  if(!c)return;
  const f=new FormData(e.target);
  c.capacity=Number(f.get("capacity"))||0;
  c.status=f.get("status");
  if(save())render();
}

function assignCompany(cid){
  const s=pupil(selected);
  if(!s)return;
  if(cid){
    const c=company(cid);
    if(!c||c.status!=="Tackat ja"){
      alert("Företaget måste ha tackat ja.");
      render();return;
    }
    const used=data.students.filter(other=>
      other.id!==s.id &&
      other.companyId===cid &&
      (groups[other.group]||[]).some(w=>
        (groups[s.group]||[]).includes(w))
    ).length;
    if(used>=Number(c.capacity||0)){
      alert("Inga lediga platser under dessa veckor.");
      render();return;
    }
  }
  s.companyId=cid;s.supervisorId="";
  if(save())render();
}
function assignSupervisor(hid){
  const s=pupil(selected),h=supervisor(hid);
  if(!s)return;
  if(hid&&(!h||h.companyId!==s.companyId))return;
  s.supervisorId=hid;
  if(save())render();
}

function momentList(s){
  return courseList(s).map(([course])=>`
    <div class="item">
      <h3>${safe(course)}</h3>
      ${(moments[course]||[]).map((m,i)=>{
        const key=s.id+"|"+course+"|"+i;
        const value=data.progress[key]||"";
        return `<div class="item">
          <div>${safe(m)}</div>
          <select onchange="setMoment('${safe(key)}',this.value)">
            <option value="" ${!value?"selected":""}>Inte gjort ännu</option>
            <option value="seen" ${value==="seen"?"selected":""}>Jag har sett det</option>
            <option value="done" ${value==="done"?"selected":""}>Jag har utfört det</option>
          </select>
        </div>`;
      }).join("")}
    </div>
  `).join("")+`<p class="muted">Elevens markering är inte ett betyg.</p>`;
}
function setMoment(key,value){
  data.progress[key]=value;save();
}
function approvalLabel(a){
  return !a?"Inte inskickad":a.status==="submitted"?"Väntar på handledare":a.status==="approved"?"Godkänd":a.status==="changes"?"Behöver ändras":"Inte inskickad";
}
function reopenWeek(sid,w){
  if(!confirm("Öppna vecka "+w+" för ändringar?"))return;
  delete data.timeApprovals[sid+"|"+w];if(save())render();
}
function submitWeek(){
  const s=pupil(selected),key=s.id+"|"+week,days=data.time[key];
  if(!days||days.length!==5||days.some(d=>!d.status)){
    alert("Fyll i och spara alla fem dagar först.");return;
  }
  if(!s.supervisorId){alert("En handledare måste vara kopplad till eleven först.");return;}
  if(!confirm("Skicka vecka "+week+" till handledaren för godkännande?"))return;
  data.timeApprovals[key]={status:"submitted",submittedAt:new Date().toISOString()};
  if(save())render();
}
function approveWeek(sid,w,hid,decision){
  const s=pupil(sid),key=sid+"|"+w,a=data.timeApprovals[key];
  if(!s||s.supervisorId!==hid||!a||a.status!=="submitted")return;
  const comment=el("approval-comment-"+sid+"-"+w)?.value.trim()||"";
  if(decision==="changes"&&!comment){alert("Skriv vad eleven behöver ändra.");return;}
  data.timeApprovals[key]={...a,status:decision,comment,approvedBy:hid,reviewedAt:new Date().toISOString()};
  if(save())render();
}
function totalHours(sid){
  return Object.entries(data.time)
    .filter(([key])=>key.startsWith(sid+"|"))
    .reduce((sum,[,days])=>sum+
      (Array.isArray(days)?days:[]).reduce((n,d)=>
        n+(d.status==="present"?(Number(d.hours)||0):0),0),0);
}

function saveTime(e){
  e.preventDefault();
  const approval=data.timeApprovals[selected+"|"+week];
  if(approval?.status==="approved"||approval?.status==="submitted"){
    alert("Veckan är låst.");return;
  }
  const f=new FormData(e.target),days=[];
  for(let i=0;i<5;i++){
    const status=f.get("status"+i);
    const hours=Number(f.get("hours"+i)||0);
    if(status==="present"&&hours<=0){
      alert("Ange arbetade timmar för närvarodagar.");return;
    }
    days.push({status,hours:status==="present"?hours:0});
  }
  if(days.some(d=>d.status==="sick"||d.status==="absent")&&!f.has("called")){
    if(!confirm("Har du meddelat APL-platsen? Tidrapporten ersätter inte sjukanmälan."))return;
  }
  data.time[selected+"|"+week]=days;
  if(approval?.status==="changes")delete data.timeApprovals[selected+"|"+week];
  if(save()){
    render();
    alert("Tidrapporten är sparad i testversionen.");
  }
}

    <div class="notice"><strong>Förifyllda beslutsunderlag för årskurs 2 och 3.</strong>
      <p>Välj elev så hämtas kurser och timmar. Anpassa vilka delar som ska genomföras på just den arbetsplatsen. Detta är ett utkast tills rektor har fattat beslut.</p>
      <p class="muted">Testversion utan säker inloggning. Använd endast fiktiva uppgifter. Ett sparat underlag är inte ett faktiskt rektorsbeslut.</p>
    </div>
    <div class="card">
      <h3>Skapa beslutsunderlag</h3>
      <form onsubmit="addDecision(event)">
        <label>Elev</label>
        <select name="studentId" required onchange="decisionStudentChanged(this.value)">${decisionStudentOptions()}</select>
        <div id="decision-scope">${decisionScopeFields()}</div>
        <div class="fields">
          <div><label>APL-period, från</label><input type="date" name="periodStart" required></div>
          <div><label>APL-period, till</label><input type="date" name="periodEnd" required></div>
        </div>
        <label>Datum för samråd med arbetsplatsen</label><input name="consultDate" type="date" required>
        <label>Samråd med (namn och roll)</label><input name="consultWith" required>
        <label>Vad har stämts av med arbetsplatsen?</label>
        <textarea name="consultNotes" placeholder="Exempel: arbetsuppgifter, handledning och möjlighet att genomföra valda moment" required></textarea>
        <label>Övriga anteckningar</label><textarea name="notes"></textarea>
        <h3>Rektorsbeslut</h3>
        <p class="muted">Fyll i nedan först när ett verkligt beslut har fattats och kontrollerats mot originalet.</p>
        <label>Beslutsdatum</label><input name="decisionDate" type="date">
        <label>Beslutande rektor</label><input name="principal">
        <label><input type="checkbox" name="approved"> Rektorsbeslut finns och har kontrollerats mot originalet</label>
        <button class="btn">Spara underlag</button>
      </form>
    </div>
    <h3>Sparade underlag</h3>
    ${data.decisions.length?data.decisions.slice().reverse().map(d=>`
      <div class="card yellow">
        <h3>${safe(pupil(d.studentId)?.name||"Okänd elev")}</h3>
        <p>${safe(d.periodStart||"")}${d.periodEnd?" – "+safe(d.periodEnd):""}</p>
        <p><strong>Företag:</strong> ${safe(d.companyName||company(pupil(d.studentId)?.companyId)?.name||"Ej angivet")}</p>
        <p><strong>Samråd:</strong> ${safe(d.consultDate)} – ${safe(d.consultWith)}</p>
        <p><strong>Status:</strong> ${d.approved?"Rektorsbeslut kontrollerat":"Underlag – ännu inte kontrollerat rektorsbeslut"}</p>
        <button class="btn alt" onclick="printDecision('${safe(d.id)}')">Visa / Skriv ut / Spara PDF</button>
      </div>`).join(""):'<div class="card"><p>Inga underlag sparade ännu.</p></div>'}
  `;
}

function addDecision(e){
  e.preventDefault();
  const f=new FormData(e.target),sid=String(f.get("studentId")||"");
  const s=pupil(sid);
  if(!s)return alert("Välj elev först.");
  const periodStart=String(f.get("periodStart")||""),periodEnd=String(f.get("periodEnd")||"");
  if(periodEnd<periodStart)return alert("Slutdatum måste vara efter startdatum.");
  const list=courseList(s);
  const selectedCourses=list.map(([name,defaultHours],i)=>{
    if(!f.has("course-"+i))return null;
    const hours=Number(f.get("hours-"+i));
    if(!Number.isInteger(hours)||hours<0)return {invalid:true};
    const chosen=f.getAll("moment-"+i).map(Number).filter(j=>Number.isInteger(j)&&j>=0&&j<(moments[name]||[]).length);
    const extra=String(f.get("extra-"+i)||"").trim();
    return {name,hours,moments:chosen.map(j=>moments[name][j]),extra};
  }).filter(Boolean);
  if(!selectedCourses.length)return alert("Välj minst en kurs eller nivå.");
  if(selectedCourses.some(c=>c.invalid))return alert("Kontrollera APL-timmarna.");
  if(selectedCourses.some(c=>!c.moments.length&&!c.extra))return alert("Ange minst ett moment eller en precisering för varje vald kurs.");
  if(f.has("approved")&&(!f.get("principal")||!f.get("decisionDate")))return alert("Ange rektor och beslutsdatum för kontrollerat beslut.");
  const c=company(s.companyId),h=supervisor(s.supervisorId);
  data.decisions.push({
    id:uid(),studentId:sid,group:s.group,companyName:c?.name||"",supervisorName:h?.name||"",
    periodStart,periodEnd,consultDate:String(f.get("consultDate")||""),
    consultWith:String(f.get("consultWith")||"").trim(),consultNotes:String(f.get("consultNotes")||"").trim(),
    decisionDate:String(f.get("decisionDate")||""),principal:String(f.get("principal")||"").trim(),
    courses:selectedCourses,scope:selectedCourses.map(c=>c.name+" ("+c.hours+" timmar): "+[...c.moments,c.extra].filter(Boolean).join(", ")).join("\n"),
    notes:String(f.get("notes")||"").trim(),approved:f.has("approved")
  });
  decisionStudentId="";
  if(save())render();
}

let printedDecisionId="";
function printDecision(id){printedDecisionId=id;page="decisionPrint";render();window.scrollTo(0,0);}
function decisionPrintView(){
  const d=data.decisions.find(x=>x.id===printedDecisionId);
  if(!d)return `<button class="btn" onclick="go('decisions')">Tillbaka</button><p>Underlaget hittades inte.</p>`;
  const s=pupil(d.studentId);
  const sections=Array.isArray(d.courses)?d.courses.map(c=>`<tr><td><strong>${safe(c.name)}</strong><br>${c.moments.map(safe).join("; ")}${c.extra?"; "+safe(c.extra):""}</td><td style="white-space:nowrap">${Number(c.hours)||0} h</td></tr>`).join("")
    :`<tr><td>${safe(d.scope||"Äldre underlag – kontrollera innehållet")}</td><td>–</td></tr>`;
  return `<div class="no-print"><button class="btn back" onclick="go('decisions')">Tillbaka</button><button class="btn" onclick="window.print()">Skriv ut / Spara som PDF</button></div>
    <div class="card" id="decision-print-sheet" style="background:white;color:#222;border:1px solid #bbb;border-radius:0">
      <h2 style="font-size:23px">Underlag för rektorsbeslut om APL</h2>
      <p><strong>${d.approved?"Beslut uppges vara kontrollerat mot original":"UTKAST – inget rektorsbeslut registrerat"}</strong></p>
      <p><strong>Elev:</strong> ${safe(s?.name||"Saknas")}<br>
      <strong>Klass:</strong> ${safe(d.group||s?.group||"")}<br>
      <strong>APL-arbetsplats:</strong> ${safe(d.companyName||company(s?.companyId)?.name||"Ej angiven")}<br>
      <strong>Handledare:</strong> ${safe(d.supervisorName||"Ej angiven")}<br>
      <strong>APL-period:</strong> ${safe(d.periodStart||"Ej angiven")} – ${safe(d.periodEnd||"Ej angiven")}</p>
      <h3>Kurser/ämnesnivåer och delar som förläggs till APL</h3>
      <table><tr><th>Kurs/nivå och planerat innehåll</th><th>Tid</th></tr>${sections}</table>
      <p><strong>Totalt planerad tid:</strong> ${Array.isArray(d.courses)?d.courses.reduce((n,c)=>n+(Number(c.hours)||0),0)+" timmar":"Se underlag"}</p>
      <h3>Samråd med arbetsplatsen</h3>
      <p><strong>Datum:</strong> ${safe(d.consultDate||"Ej angivet")}<br><strong>Med:</strong> ${safe(d.consultWith||"Ej angivet")}</p>
      <p>${safe(d.consultNotes||"Ingen samrådsanteckning registrerad")}</p>
      ${d.notes?`<h3>Övrigt</h3><p>${safe(d.notes)}</p>`:""}
      <h3>Rektors beslut</h3>
      <p><strong>Beslutsdatum:</strong> ${safe(d.decisionDate||"Ej registrerat")}<br><strong>Beslutande rektor:</strong> ${safe(d.principal||"Ej registrerad")}</p>
      <p>Underskrift: _______________________________________</p>
      <p class="muted">Underlaget ska granskas mot gällande styrdokument och dokumenteras i skolans godkända system. En markering i Praktiknavets testversion ersätter inte rektors faktiska beslut.</p>
    </div>`;
}

/* HANDLEDARE */

function supervisorView(){
  if(!data.supervisors.length)return `
    <h2>Handledare</h2><p>Ingen handledare registrerad.</p>
  `;
  const h=supervisor(selectedSupervisor)||data.supervisors[0];
  const students=data.students.filter(s=>s.supervisorId===h.id);
  return `
    <h1>Hej och välkommen!</h1>
    <p>Här ser du dina APL-elever.</p>
    <div class="notice">
      Demoläge. Detta är inte en säker inloggning.
    </div>
    <div class="card yellow">
      <label>Visa som handledare</label>
      <select onchange="selectedSupervisor=this.value;render()">
        ${options(data.supervisors,h.id,x=>x.name)}
      </select>
      <h3 style="margin-top:20px">${safe(h.name)}</h3>
      <p>${safe(company(h.companyId)?.name)}</p>
      <p>${safe(h.phone)}</p>
    </div>
    <div class="card">
      <h3>Mina APL-elever</h3>
      ${students.length?students.map(s=>`
        <div class="item">
          <strong>${safe(s.name)}</strong>
          <p>Veckor: ${(groups[s.group]||[]).join(", ")}</p>
          ${(groups[s.group]||[]).map(w=>{
            const key=s.id+"|"+w,a=data.timeApprovals[key];
            const days=data.time[key]||[];
            const hours=days.reduce((n,d)=>n+(d.status==="present"?(Number(d.hours)||0):0),0);
            return `<div class="item"><strong>Vecka ${w}</strong> – ${approvalLabel(a)}<p>${hours} rapporterade timmar</p>
              ${a?.comment?`<p>Kommentar: ${safe(a.comment)}</p>`:""}
              ${a?.status==="submitted"?`<label>Kommentar (frivillig vid godkännande)</label>
                <textarea id="approval-comment-${s.id}-${w}"></textarea>
                <button class="btn" onclick="approveWeek('${s.id}',${w},'${h.id}','approved')">Godkänn veckan</button>
                <button class="btn alt" onclick="approveWeek('${s.id}',${w},'${h.id}','changes')">Begär ändring</button>`:""}
            </div>`;
          }).join("")}
        </div>
      `).join(""):"<p>Ingen elev är kopplad till handledaren ännu.</p>"}
      <p class="muted">Godkännandet fungerar bara som demo i samma webbläsare. För riktiga användare krävs säker inloggning och gemensam datalagring.</p>
    </div>
  `;
}
