



<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#A65339">
<title>Praktiknavet – APL utan krångel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400,20,1;9..144,500,20,1;9..144,600,20,1&display=swap" rel="stylesheet">

<style>
:root {
  --terra:#A65339;
  --terra-dark:#7E3D2D;
  --terra-soft:#EAD1C2;
  --sage:#66715A;
  --sage-light:#E4E8DB;
  --ochre:#C29B52;
  --linen:#E7D4B0;
  --cream:#FAF5EB;
  --paper:#FFFCF7;
  --ink:#42372F;
  --muted:#796E64;
  --line:#E8DDD0;
  --shadow:0 8px 28px rgba(77,51,37,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font:15px/1.6 "DM Sans",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--ochre);
  outline-offset:2px;
}
button:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3{line-height:1.18}
h1,h2{
  font-family:"Fraunces",Georgia,serif;
  font-weight:500;
  letter-spacing:-.035em;
}
h1{font-size:clamp(34px,5vw,55px);margin:0 0 14px}
h2{font-size:clamp(27px,3.3vw,36px);margin:0 0 10px}
h3{font-size:18px;margin:0 0 10px;font-weight:700}
p{margin:8px 0 14px}
a{color:var(--terra-dark)}
small,.small{font-size:12px}
.muted{color:var(--muted)}
.eyebrow{
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:11px;
  font-weight:800;
}
.shell{max-width:1180px;margin:auto;padding:0 24px}
.site-header{
  background:#F1E5D4;
  color:#8C4D38;
  position:relative;
  overflow:hidden;
}
}
.site-header:before{
  content:"";
  position:absolute;
  right:-70px;top:-90px;
  width:340px;height:340px;
  border:1px solid rgba(255,245,230,.2);
  border-radius:42% 58% 45% 55%;
  transform:rotate(-30deg);
  pointer-events:none;
}
.site-header:after{
  content:"";
  position:absolute;
  right:65px;top:-95px;
  width:150px;height:300px;
  border:1px solid rgba(255,245,230,.13);
  border-radius:50%;
  transform:rotate(35deg);
  pointer-events:none;
}
.header-inner{
  position:relative;z-index:1;
  display:flex;justify-content:space-between;
  align-items:center;gap:24px;
  min-height:112px;
}
.brand{
  font-family:"Fraunces",Georgia,serif;
  font-size:31px;
  letter-spacing:-.05em;
  line-height:1.15;
}
.brand-heart{color:#F0C77A;font-size:23px}
.brand-sub{
  color:#F5DDD0;
  font-size:12px;
  letter-spacing:.07em;
  margin-top:5px;
}
.role-box{display:flex;align-items:center;gap:12px}
.role-box label{color:#FFE7D8;font-size:12px;font-weight:700}
.role-box select{
  width:auto;min-width:130px;
  margin:0;background:#FFF8EF;
  border-color:transparent;
}
main{padding-top:34px!important;padding-bottom:90px!important}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:28px;flex-wrap:wrap;
}
.breadcrumb{font-size:13px;color:var(--muted)}
.back{
  border:1px solid var(--line);
  background:var(--paper);
  padding:10px 16px;border-radius:12px;
  color:var(--terra-dark);
  font-weight:700;
}
.hero{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  padding:clamp(26px,5vw,52px);
  box-shadow:var(--shadow);
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
}
.hero:after{
  content:"";
  position:absolute;
  width:170px;height:250px;
  right:-85px;bottom:-120px;
  border:2px solid #EAD8C5;
  border-radius:50% 0 50% 0;
  transform:rotate(-38deg);
  pointer-events:none;
}
.hero p{max-width:570px;font-size:16px;color:var(--muted)}
.hero .eyebrow{color:var(--terra)}
.section-title{margin:28px 0 15px}
.section-title h2{font-size:27px}
.tile-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.tile{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  text-align:left;
  min-height:158px;
  padding:26px 27px;
  border:1px solid transparent;
  border-radius:20px;
  transition:transform .15s,box-shadow .15s;
  color:var(--ink);
}
.tile:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.tile strong{
  font-family:"Fraunces",Georgia,serif;
  font-size:27px;
  font-weight:500;
  letter-spacing:-.025em;
}
.tile span{font-size:13px;color:#63574C}
.tile.terra{background:#E8D1C4}
.tile.sage{background:#E2E7D9}
.tile.sand{background:#EFE1C9}
.tile.rose{background:#EBDCD5}
.secondary-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.secondary-tile{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  min-height:95px;
  text-align:left;
  color:var(--ink);
  font-weight:700;
}
.secondary-tile:hover{background:#F5EBDD}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
  margin:22px 0 30px;
}
.stat{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:17px;
  padding:20px;
}
.stat strong{
  display:block;
  font-family:"Fraunces",Georgia,serif;
  font-size:33px;
  font-weight:500;
  color:var(--terra-dark);
}
.stat span{font-size:12px;color:var(--muted)}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:19px;
  padding:24px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}
.card.soft{background:#F1E4D8}
.card.sage{background:var(--sage-light)}
.row{
  display:flex;align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.stack{display:grid;gap:15px}
.two-col{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.tag{
  display:inline-flex;align-items:center;
  background:var(--sage-light);
  color:#46533D;
  padding:5px 11px;
  border-radius:99px;
  font-size:12px;
  font-weight:700;
}
.tag.wait{background:#F3E7CC;color:#785A29}
.tag.no{background:#F2DAD4;color:#8A4437}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:12px 0 4px;
}
input,select,textarea{
  display:block;
  width:100%;
  padding:12px 13px;
  border:1px solid #DCCFC2;
  border-radius:11px;
  background:#FFF;
  color:var(--ink);
  margin:7px 0 12px;
}
textarea{min-height:98px;resize:vertical}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  border-radius:12px;
  background:#FFF;
  color:var(--ink);
  padding:12px 18px;
  font-weight:700;
}
.btn:hover{background:#F6EBDD}
.btn.primary{
  background:var(--terra);
  border-color:var(--terra);
  color:white;
}
.btn.primary:hover{background:var(--terra-dark)}
.btn.sage{
  background:var(--sage);
  border-color:var(--sage);
  color:white;
}
.btn.small{padding:9px 13px;font-size:12px}
.notice{
  background:#F2E8D7;
  border-left:3px solid var(--ochre);
  border-radius:0 12px 12px 0;
  padding:15px 18px;
  margin:18px 0;
  color:#665542;
}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0 22px}
.toolbar .btn{padding:10px 14px}
.toolbar .selected{
  background:var(--terra);
  color:white;
  border-color:var(--terra);
}
.page-heading{margin-bottom:24px}
.page-heading p{color:var(--muted)}
.list-item{
  padding:17px 0;
  border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:0}
.footer{
  margin-top:48px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
.empty{
  padding:35px 20px;
  text-align:center;
  background:var(--paper);
  border:1px dashed #DCCABD;
  border-radius:16px;
  color:var(--muted);
}
@media(max-width:760px){
  .secondary-grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{padding:15px}
  .stat strong{font-size:27px}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:560px){
  .shell{padding-left:16px;padding-right:16px}
  .header-inner{min-height:104px}
  .brand{font-size:25px}
  .role-box{display:block}
  .role-box label{margin:0 0 4px}
  .role-box select{min-width:105px}
  .tile-grid{grid-template-columns:1fr;gap:12px}
  .tile{min-height:118px;padding:22px}
  .tile strong{font-size:25px}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat strong{font-size:24px}
  .stat span{font-size:10px}
  .secondary-grid{gap:9px}
  .secondary-tile{min-height:85px;padding:15px;font-size:13px}
  .card{padding:19px}
  .hero{padding:25px}
}
</style>
</head>

<body>
<header class="site-header">
  <div class="shell header-inner">
    <div>
      <div class="brand">Praktiknavet<span class="brand-heart"> ♥</span></div>
      <div class="brand-sub">APL UTAN KRÅNGEL</div>
    </div>
    <div class="role-box">
      <label for="role">Visa som</label>
      <select id="role" onchange="setRole(this.value)">
        <option value="teacher">Lärare</option>
        <option value="student">Elev</option>
      </select>
    </div>
  </div>
</header>

<main id="app" class="shell"></main>

<script>
"use strict";

/* APL-veckor våren 2027 */
const W = {
  NVF25A:[3,4,5],
  NVF25B:[6,7,9],
  NVF24A:[10,11,12,14,15,16],
  NVF24B:[17,18,19,20,21]
};

/* Planerade APL-timmar */
const courses = {
  NVF25:[
    ["VVS och fastighet nivå 2",40],
    ["VVS-teknik nivå 1",20],
    ["VVS-teknik nivå 2",30],
    ["VVS-installation nivå 1",20],
    ["Försäljning och kundservice nivå 1",40]
  ],
  NVF24:[
    ["Entreprenadteknik",20],
    ["Injusteringsteknik",30],
    ["VVS gassvetsning rör",30],
    ["VVS-teknik",130],
    ["Värmeteknik 2",40]
  ]
};

const demoStudents = [];
for (const [group,count] of [
  ["NVF25A",10],
  ["NVF25B",10],
  ["NVF24A",9],
  ["NVF24B",8]
]) {
  for(let i=1;i<=count;i++){
    demoStudents.push({
      id:group+"-"+i,
      name:"Elev "+String(i).padStart(2,"0")+" · "+group,
      group,
      company:""
    });
  }
}

const defaults = {
  students:demoStudents,
  companies:[
    {
      id:"c1",
      name:"Exempel VVS AB",
      contact:"Anna Andersson",
      phone:"070-000 00 01",
      capacity:2,
      status:"Tackat ja",
      history:[]
    },
    {
      id:"c2",
      name:"Rör & Värme Demo",
      contact:"Erik Eriksson",
      phone:"070-000 00 02",
      capacity:1,
      status:"Kontaktad",
      history:[]
    }
  ],
  reports:[],
  visits:[],
  risks:[],
  decisions:[]
};

const STORAGE_KEY = "praktiknavet-tomas-v1";

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

let data;
try{
  data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || clone(defaults);
}catch(e){
  data = clone(defaults);
}

/* Komplettera äldre sparad demodata */
for(const key of ["students","companies","reports","visits","risks","decisions"]){
  if(!Array.isArray(data[key])) data[key]=clone(defaults[key]);
}
for(const c of data.companies){
  if(!Array.isArray(c.history)) c.history=[];
}

let role="teacher";
let page="home";
let studentId=data.students[0]?.id || "";
let groupFilter="all";

const app=document.getElementById("app");

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }catch(e){
    alert("Det gick inte att spara i webbläsaren.");
  }
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function student(id){
  return data.students.find(s=>s.id===id);
}
function company(id){
  return data.companies.find(c=>c.id===id);
}
function companyName(id){
  return company(id)?.name || "Inte placerad";
}
function weeks(s){
  return W[s?.group]||[];
}
function overlap(a,b){
  return a.some(w=>b.includes(w));
}
function occupied(c,s){
  return data.students.filter(x=>
    x.id!==s.id &&
    x.company===c.id &&
    overlap(weeks(x),weeks(s))
  ).length;
}
function tag(status){
  let type=status==="Tackat ja"?"":
    status==="Tackat nej"?"no":"wait";
  return `<span class="tag ${type}">${esc(status)}</span>`;
}
function dateToday(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}
function setRole(value){
  role=value;
  page="home";
  render();
}
function go(value){
  page=value;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function pageTop(title,description=""){
  return `
    <div class="topbar">
      <span class="breadcrumb">Praktiknavet / ${esc(title)}</span>
      <button class="back" onclick="go('home')">Till startsidan</button>
    </div>
    <div class="page-heading">
      <h2>${esc(title)}</h2>
      ${description?`<p>${esc(description)}</p>`:""}
    </div>
  `;
}
function footer(){
  return `<div class="footer">
    Praktiknavet ♥ · Demoversion · Uppgifter sparas lokalt i webbläsaren
  </div>`;
}

function render(){
  document.getElementById("role").value=role;
  if(role==="student"){
    renderStudent();
    return;
  }

  let html="";

  if(page==="home") html=renderHome();
  if(page==="companies") html=renderCompanies();
  if(page==="students") html=renderStudents();
  if(page==="reports") html=renderReports();
  if(page==="todo") html=renderTodo();
  if(page==="courses") html=renderCourses();
  if(page==="visits") html=renderRecords("visits");
  if(page==="risks") html=renderRecords("risks");
  if(page==="decisions") html=renderRecords("decisions");

  app.innerHTML=html+footer();
}

function renderHome(){
  const placed=data.students.filter(s=>s.company).length;
  const unanswered=data.reports.filter(r=>!r.reply).length;

  return `
    <section class="hero">
      <div class="eyebrow">Välkommen tillbaka</div>
      <h1>Allt kring APL.<br>På ett och samma ställe.</h1>
      <p>
        Håll koll på företag, elever och praktikveckor.
        Lite mindre administration, lite mer tid till eleverna.
      </p>
    </section>

    <div class="stats">
      <div class="stat">
        <strong>${placed}/${data.students.length}</strong>
        <span>Elever placerade</span>
      </div>
      <div class="stat">
        <strong>${data.companies.length}</strong>
        <span>Företag</span>
      </div>
      <div class="stat">
        <strong>${unanswered}</strong>
        <span>Rapporter att svara på</span>
      </div>
    </div>

    <div class="section-title">
      <h2>Vad vill du göra?</h2>
      <p class="muted">Välj det du behöver arbeta med.</p>
    </div>

    <div class="tile-grid">
      <button class="tile terra" onclick="go('companies')">
        <strong>Företag</strong>
        <span>Kontakter, svar och lediga platser</span>
      </button>
      <button class="tile sage" onclick="go('students')">
        <strong>Elever</strong>
        <span>Placeringar och APL-veckor</span>
      </button>
      <button class="tile sand" onclick="go('reports')">
        <strong>Veckorapporter</strong>
        <span>Läs, följ upp och svara</span>
      </button>
      <button class="tile rose" onclick="go('todo')">
        <strong>Att göra</strong>
        <span>Det som behöver din uppmärksamhet</span>
      </button>
    </div>

    <div class="section-title" style="margin-top:40px">
      <h2>Fler verktyg</h2>
    </div>

    <div class="secondary-grid">
      <button class="secondary-tile" onclick="go('courses')">
        Kurser & APL-timmar
      </button>
      <button class="secondary-tile" onclick="go('visits')">
        APL-besök
      </button>
      <button class="secondary-tile" onclick="go('risks')">
        Riskbedömning
      </button>
      <button class="secondary-tile" onclick="go('decisions')">
        APL-beslut
      </button>
    </div>

    <div class="notice small">
      Detta är en demo med fiktiva elever och företag.
      Inga uppgifter delas automatiskt mellan olika datorer.
    </div>
  `;
}

function renderCompanies(){
  return pageTop(
    "Företag",
    "Samla kontakter, dokumentera svar och håll koll på platserna."
  )+`
    <div class="card soft">
      <h3>Lägg till ett företag</h3>
      <form onsubmit="addCompany(event)">
        <div class="two-col">
          <div>
            <label>Företagets namn
              <input name="name" required placeholder="Företagsnamn">
            </label>
          </div>
          <div>
            <label>Kontaktperson
              <input name="contact" placeholder="Namn">
            </label>
          </div>
          <div>
            <label>Telefon
              <input name="phone" placeholder="Telefonnummer">
            </label>
          </div>
          <div>
            <label>Antal samtidiga APL-platser
              <input name="capacity" type="number" min="1" value="1" required>
            </label>
          </div>
        </div>
        <button class="btn primary" type="submit">Lägg till företag</button>
      </form>
    </div>

    <div class="section-title">
      <h2>Företagslista</h2>
      <p class="muted">${data.companies.length} företag registrerade</p>
    </div>

    ${data.companies.map(c=>`
      <div class="card">
        <div class="row">
          <h3>${esc(c.name)}</h3>
          ${tag(c.status)}
        </div>
        <p class="muted">
          ${esc(c.contact||"Ingen kontaktperson")}
          ${c.phone?" · "+esc(c.phone):""}
        </p>
        <p><strong>Kapacitet:</strong> ${Number(c.capacity)||1}
          samtidiga elever</p>

        <div class="two-col">
          <div>
            <label>Status
              <select onchange="updateCompany('${c.id}','status',this.value)">
                ${[
                  "Inte kontaktad","Kontaktad","Väntar svar",
                  "Tackat ja","Tackat nej"
                ].map(x=>`
                  <option ${x===c.status?"selected":""}>${x}</option>
                `).join("")}
              </select>
            </label>
          </div>
          <div>
            <label>Antal platser
              <input type="number" min="1"
                value="${Number(c.capacity)||1}"
                onchange="changeCapacity('${c.id}',this.value)">
            </label>
          </div>
        </div>

        <label>Kontaktanteckning
          <textarea id="note-${c.id}"
            placeholder="Vad har ni pratat om?"></textarea>
        </label>
        <button class="btn small" onclick="addNote('${c.id}')">
          Spara anteckning
        </button>

        ${(c.history||[]).length?`
          <hr>
          <h3>Kontaktlogg</h3>
          ${c.history.map(h=>`
            <div class="list-item small">${esc(h)}</div>
          `).join("")}
        `:""}
      </div>
    `).join("")}
  `;
}

function renderStudents(){
  const groups=Object.keys(W);
  const list=data.students.filter(s=>
    groupFilter==="all"||s.group===groupFilter
  );
  const placed=data.students.filter(s=>s.company).length;

  return pageTop(
    "Elever & placeringar",
    "Välj företag för varje elev. Appen kontrollerar företagets kapacitet."
  )+`
    <div class="stats">
      <div class="stat">
        <strong>${data.students.length}</strong>
        <span>Elever totalt</span>
      </div>
      <div class="stat">
        <strong>${placed}</strong>
        <span>Placerade</span>
      </div>
      <div class="stat">

    <div class="toolbar">
      <button class="btn ${groupFilter==="all"?"selected":""}"
        onclick="filterGroup('all')">Alla</button>
      ${groups.map(g=>`
        <button class="btn ${groupFilter===g?"selected":""}"
          onclick="filterGroup('${g}')">${g}</button>
      `).join("")}
    </div>

    ${list.map(s=>`
      <div class="card">
        <div class="row">
          <h3>${esc(s.name)}</h3>

        </div>

            `).join("")}
          </select>

    `).join("")}
  `;
}

function filterGroup(g){

}

/* Företag */
function addCompany(event){
  event.preventDefault();
  const f=new FormData(event.target);
  data.companies.push({
    id:"c"+Date.now(),
    name:String(f.get("name")).trim(),
    contact:String(f.get("contact")).trim(),
    phone:String(f.get("phone")).trim(),
    capacity:Number(f.get("capacity")),
    status:"Inte kontaktad",
    history:[]
  });
  save();
  render();
}
function updateCompany(id,key,value){
  const c=company(id);
  if(!c)return;
  c[key]=value;
  save();
  render();
}
function changeCapacity(id,value){
  const c=company(id);
  if(!c)return;
  const n=Number(value);

  if(!Number.isInteger(n)||n<1){
    alert("Ange minst en plats.");
    render();
    return;
  }

  const assigned=data.students.filter(s=>s.company===id);
  const tooFew=assigned.some(s=>occupied(c,s)+1>n);

  if(tooFew){
    alert("Det finns redan fler samtidigt placerade elever än så.");
    render();
    return;
  }

  c.capacity=n;
  save();
  render();
}
function addNote(id){
  const c=company(id);
  const field=document.getElementById("note-"+id);
  if(!c||!field)return;

  const note=field.value.trim();
  if(!note)return;

  c.history.unshift(
    new Date().toLocaleDateString("sv-SE")+" · "+note
  );
  save();
  render();
}

/* Placeringar */
function place(id,companyId){
  const s=student(id);
  if(!s)return;

  if(companyId){
    const c=company(companyId);
    if(!c){
      alert("Företaget kunde inte hittas.");
      render();
      return;
    }
    if(c.status!=="Tackat ja"){
      alert("Företaget måste ha tackat ja innan eleven placeras.");
      render();
      return;
    }
    if(occupied(c,s)>=Number(c.capacity)){
      alert("Företaget har inte plats för fler elever under dessa veckor.");
      render();
      return;
    }
  }

  s.company=companyId;
  save();
  render();
}

/* Lärarsvar */
function reply(id){
  const r=data.reports.find(x=>String(x.id)===String(id));
  const field=document.getElementById("reply-"+id);
  if(!r||!field)return;

  r.reply=field.value.trim();
  save();
  render();
}

/* Besök och underlag */
function addRecord(event,type){
  event.preventDefault();
  const f=new FormData(event.target);
  const s=student(f.get("studentId"));
  if(!s)return;

  data[type].unshift({
    id:"record-"+Date.now(),
    studentId:s.id,
    companyId:s.company,
    date:String(f.get("date")),
    notes:String(f.get("notes")).trim()
  });
  save();
  render();
}

/* Elevens inlämning */
function submitReport(event){
  event.preventDefault();
  const f=new FormData(event.target);
  const week=Number(f.get("week"));

  if(data.reports.some(r=>
    r.studentId===studentId && Number(r.week)===week
  )){
    alert("Du har redan lämnat in en rapport för den veckan.");
    return;
  }

  data.reports.unshift({
    id:"r"+Date.now(),
    studentId,
    week,
    did:String(f.get("did")).trim(),
    learned:String(f.get("learned")).trim(),
    feeling:String(f.get("feeling")).trim(),
    rating:Number(f.get("rating")),
    reply:""
  });

  save();
  render();
  alert("Din veckorapport är inlämnad!");
}

render();
